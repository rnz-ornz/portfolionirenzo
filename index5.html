<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Interactive Student Card</title>

    <link rel="stylesheet" href="style5.css">

</head>
    	
<body>

<div class="card">

    <img
        id="studentImage"
        src="pogii.jpg"
        alt="Student"
    >

    <h1 id="studentName">
        RenzOOO
    </h1>

    <p id="course">
        BS Information Technology
    </p>

    <input
        type="text"
        id="nameInput"
        placeholder="Type your nickname"
    >

    <select id="yearSelect">

        <option value="">FAVORITES</option>

        <option>Reading a Book</option>
        <option>Watching KDrama</option>
        <option>Listening Music</option>
        <option>JavaChip Frappe</option>

    </select>

<div class="buttons">

    <button id="clickBtn">Click</button>

    <button id="dblClickBtn">Double Click</button>

    <!-- <button id="changeImageBtn">Change Image</button> -->

    <button id="pressBtn">Press & Hold</button>

</div>

    <p id="status">
        Loadingggg...
    </p>

    <a href="index.html" class="btn">GO BACK TO PORTFOLIO</a>

</div>

<script src="script5.js"></script>

</body>

</html>
